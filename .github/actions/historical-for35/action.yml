name: Historical FOR-35 pinned preflight, tests, and regeneration
description: Reproduce the immutable FOR-35 artifacts on their original commit.
runs:
  using: composite
  steps:
    - name: Check out the pinned FOR-35 commit
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: 3139c7b953c38d96d35e0baf2267781138ebcb71
        fetch-depth: 0
        persist-credentials: false

    - name: Assert the checkout is exactly the pinned commit
      shell: pwsh
      env:
        FOR35_PINNED_COMMIT: 3139c7b953c38d96d35e0baf2267781138ebcb71
      run: |
        $head = git rev-parse HEAD
        Write-Host "HEAD=$head"
        if ($head -ne $env:FOR35_PINNED_COMMIT) { throw "checkout $head is not the pinned commit $env:FOR35_PINNED_COMMIT" }

    - name: Set up Python 3.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install package and test dependencies
      shell: pwsh
      run: python -m pip install -e ".[dev]"

    - name: Historical preflight (frozen engine fingerprint, protocol, errata, seeds)
      shell: pwsh
      run: python -m formicmind.starvation_confirm preflight

    - name: Historical pytest (original FOR-35 test module, frozen engine, no skips)
      shell: pwsh
      run: python -m pytest tests/test_starvation_confirm.py -q -ra -p no:cacheprovider

    - name: Strict verify, full regeneration of the 4800 published matches
      shell: pwsh
      run: python -m formicmind.starvation_confirm verify --input results/starvation_confirm --workers 4
