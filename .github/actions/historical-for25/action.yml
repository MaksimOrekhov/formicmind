name: Historical FOR-25 pinned test and regeneration
description: Reproduce the immutable FOR-25 artifacts on their original commit.
runs:
  using: composite
  steps:
    - name: Check out the pinned FOR-25 commit
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: 737de9cd7ed2451d45a59ca21da9167476a47660
        fetch-depth: 0
        persist-credentials: false

    - name: Assert the checkout is exactly the pinned commit
      shell: pwsh
      env:
        FOR25_PINNED_COMMIT: 737de9cd7ed2451d45a59ca21da9167476a47660
      run: |
        $head = git rev-parse HEAD
        Write-Host "HEAD=$head"
        if ($head -ne $env:FOR25_PINNED_COMMIT) { throw "checkout $head is not the pinned commit $env:FOR25_PINNED_COMMIT" }

    - name: Set up Python 3.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install package and test dependencies
      shell: pwsh
      run: python -m pip install -e ".[dev]"

    - name: Historical pytest (frozen engine, no skips)
      shell: pwsh
      run: python -m pytest historical/for25 -q -ra

    - name: Strict verify, full regeneration of the published results
      shell: pwsh
      run: python -m formicmind.starvation_debt verify --input results/starvation_debt --jobs 4 --record "$env:RUNNER_TEMP/verification_record.json"

    - name: Show the verification record
      shell: pwsh
      run: Get-Content "$env:RUNNER_TEMP/verification_record.json"
