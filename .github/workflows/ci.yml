name: CI

# Required PR correctness checks. Full pinned historical reproduction is conditional on a fail-closed path policy;
# the independent weekly/manual workflow is .github/workflows/historical.yml.
on:
  push:
    branches: [main, "for-*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer run for the same ref replaces the older one; runs of other refs/commits are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows CI (Python 3.12, Node 22)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      # Actions are pinned to full commit SHAs (tags noted for readability).
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Show interpreter
        run: python -c "import platform, sys; print(sys.version); print(platform.platform())"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: FOR-25 manifest and artifact integrity (no regeneration)
        run: python -m formicmind.starvation_debt verify --input results/starvation_debt --jobs 4 --manifest-only

      - name: FOR-35 static historical artifact integrity (no regeneration)
        run: python -m formicmind.starvation_confirm verify-static --input results/starvation_confirm

      - name: Install CPU-only PyTorch for ML smoke coverage
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Verify ML smoke runtime
        run: python -c "import torch; print('torch', torch.__version__, 'cuda available:', torch.cuda.is_available())"

      - name: Run all Python tests
        run: python -m pytest -q -ra

  viewer:
    name: Viewer build and Vitest (Node 22)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install viewer dependencies
        working-directory: viewer
        run: npm ci --no-audit --fund=false

      - name: Build viewer
        working-directory: viewer
        run: npm run build

      - name: Test viewer
        working-directory: viewer
        run: npm run test

  historical-policy:
    name: Historical sensitivity gate
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      historical_required: ${{ steps.paths.outputs.historical_required }}
    steps:
      - name: Check out changed tree and history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12 for the path policy
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Classify changed paths (fail closed)
        id: paths
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if (-not $env:BASE_SHA -or $env:BASE_SHA -match '^0+$') {
            Write-Host "Missing usable base SHA; requiring full historical checks."
            $changed = @("__unknown_base_sha__")
          } else {
            $changed = git diff --name-only "$env:BASE_SHA...$env:HEAD_SHA"
            if ($LASTEXITCODE -ne 0) { throw "Could not compute the changed-file set; refusing a fast-only result." }
          }
          $changed | python scripts/ci_historical_policy.py --github-output "$env:GITHUB_OUTPUT"

  historical-for25:
    name: Historical FOR-25 (frozen engine, pinned commit)
    needs: [historical-policy]
    if: ${{ always() && needs.historical-policy.result != 'cancelled' }}
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Fail closed if the sensitivity decision is missing or failed
        shell: pwsh
        env:
          POLICY_RESULT: ${{ needs.historical-policy.result }}
          HISTORICAL_REQUIRED: ${{ needs.historical-policy.outputs.historical_required }}
        run: |
          if ($env:POLICY_RESULT -ne "success") { throw "Historical path policy ended as $env:POLICY_RESULT." }
          if ($env:HISTORICAL_REQUIRED -notin @("true", "false")) { throw "Historical path policy output is missing or invalid." }

      - name: Explain why full regeneration is not required for this diff
        if: ${{ needs.historical-policy.result == 'success' && needs.historical-policy.outputs.historical_required == 'false' }}
        shell: pwsh
        run: Write-Host "Path policy classified this change as ML/viewer/nonhistorical documentation. Full regeneration was not run; use Historical verification manual/weekly workflow or the sensitive PR gate when applicable."

      - name: Check out the local pinned verification action
        if: ${{ needs.historical-policy.outputs.historical_required == 'true' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run pinned FOR-25 tests and strict regeneration
        if: ${{ needs.historical-policy.outputs.historical_required == 'true' }}
        uses: ./.github/actions/historical-for25

  historical-for35:
    name: Historical FOR-35 (frozen engine, pinned commit)
    needs: [historical-policy]
    if: ${{ always() && needs.historical-policy.result != 'cancelled' }}
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Fail closed if the sensitivity decision is missing or failed
        shell: pwsh
        env:
          POLICY_RESULT: ${{ needs.historical-policy.result }}
          HISTORICAL_REQUIRED: ${{ needs.historical-policy.outputs.historical_required }}
        run: |
          if ($env:POLICY_RESULT -ne "success") { throw "Historical path policy ended as $env:POLICY_RESULT." }
          if ($env:HISTORICAL_REQUIRED -notin @("true", "false")) { throw "Historical path policy output is missing or invalid." }

      - name: Explain why full regeneration is not required for this diff
        if: ${{ needs.historical-policy.result == 'success' && needs.historical-policy.outputs.historical_required == 'false' }}
        shell: pwsh
        run: Write-Host "Path policy classified this change as ML/viewer/nonhistorical documentation. Full regeneration was not run; use Historical verification manual/weekly workflow or the sensitive PR gate when applicable."

      - name: Check out the local pinned verification action
        if: ${{ needs.historical-policy.outputs.historical_required == 'true' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run pinned FOR-35 preflight, tests, and strict regeneration
        if: ${{ needs.historical-policy.outputs.historical_required == 'true' }}
        uses: ./.github/actions/historical-for35
