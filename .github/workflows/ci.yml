name: CI

# Correctness regression only (unit tests, goldens, invariants, checkpoint/determinism checks).
# It is NOT a performance benchmark and not a scientific gate; see docs/reliability.md.
# Windows only on purpose: the project is developed and verified on Windows, Python 3.12
# (pyproject.toml: requires-python >= 3.12). No matrix, no secrets, no artifacts, no third-party services.

on:
  push:
    branches: [main, "for-*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer run for the same ref replaces the older one; runs of other refs/commits are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (windows-latest, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      # Actions are pinned to full commit SHAs (tags noted for readability).
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Show interpreter
        run: python -c "import platform, sys; print(sys.version); print(platform.platform())"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q -ra
