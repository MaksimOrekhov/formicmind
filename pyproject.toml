[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formicmind"
version = "0.0.1"
description = "FormicMind L0 headless simulator: foundation (model, reset, RNG, canonical serialization, hashing)"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sim = "formicmind.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
